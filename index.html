 
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gram Bajar | गाँव का बाजार</title>
  <meta name="description" content="गाँव के हस्तनिर्मित सामान का ऑनलाइन बाजार">

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

<header class="site-header">
  <div class="brand">
    <span class="brand-mark">🌿</span>
    <div>
      <h1>Gram Bajar</h1>
      <p>गाँव के हस्तनिर्मित सामान का बाजार</p>
    </div>
  </div>
</header>

<main class="container">

  <section class="intro">
    <h2>अपने गाँव के हुनर को पहचानें</h2>
    <p>मिट्टी, बाँस और हाथ से बने उपयोगी सामान खरीदें।</p>
  </section>

  <section class="shop">

    <div class="filters">
      <input id="search" type="search"
        placeholder="🔍 कोई भी सामान खोजें...">

      <select id="category">
        <option value="all">सभी कैटेगरी</option>
      </select>

      <button id="clearButton" class="clear-btn" type="button">
        ✖ Clear
      </button>
    </div>

    <p id="resultCount" class="result-count"></p>

    <div id="products" class="products-grid"></div>

    <p id="emptyMessage" hidden>
      माफ कीजिए! कोई सामान नहीं मिला।
    </p>

  </section>

  <!-- Shopping Cart -->
  <section class="cart-section" id="cartSection">

    <h2>🛒 आपका Shopping Cart</h2>

    <div id="cartItems">
      <p class="empty-cart">आपका Cart अभी खाली है।</p>
    </div>

    <div class="cart-total">
      कुल कीमत: <span id="cartTotal">₹0</span>
    </div>

    <button id="checkoutButton" class="order-btn" type="button">
      Order Now
    </button>

  </section>

  <!-- Customer Details -->
  <section class="checkout-section" id="checkoutSection" hidden>

    <h2>📦 ऑर्डर की जानकारी</h2>

    <form id="orderForm">

      <label for="customerName">आपका नाम</label>
      <input id="customerName" type="text"
        placeholder="अपना नाम लिखें" required maxlength="60">

      <label for="customerPhone">मोबाइल नंबर</label>
      <input id="customerPhone" type="tel"
        placeholder="10 अंकों का मोबाइल नंबर"
        pattern="[6-9][0-9]{9}" maxlength="10" required>

      <label for="customerAddress">पूरा पता</label>
      <textarea id="customerAddress"
        placeholder="गाँव, पोस्ट, जिला और पिन कोड लिखें"
        rows="4" required maxlength="300"></textarea>

      <button class="whatsapp-btn" type="submit">
        WhatsApp पर ऑर्डर भेजें
      </button>

      <button id="backButton" class="back-btn" type="button">
        वापस जाएँ
      </button>

    </form>

  </section>

</main>

<footer class="site-footer">
  <p>© 2026 Gram Bajar | स्थानीय हुनर, स्थानीय बाजार</p>
</footer>

</body>
</html>
