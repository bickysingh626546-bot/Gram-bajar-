 
<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gram Bajar | गाँव का बाजार</title>

  <meta name="description" content="Gram Bajar - गाँव के हस्तनिर्मित सामान का ऑनलाइन बाजार">

  <!-- CSS Connection -->
  <link rel="stylesheet" href="style.css">

  <!-- JavaScript Connection -->
  <script src="script.js" defer></script>
</head>

<body>

  <!-- Header -->
  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">🌿</span>

      <div>
        <h1>Gram Bajar</h1>
        <p>गाँव के हस्तनिर्मित सामान का बाजार</p>
      </div>
    </div>
  </header>

  <!-- Main Section -->
  <main class="container">

    <section class="intro">
      <h2>अपने गाँव के हुनर को पहचानें</h2>
      <p>मिट्टी, बाँस और हाथ से बने उपयोगी सामान खरीदें।</p>
    </section>

    <!-- Search and Filter -->
    <section class="shop">

      <div class="filters">

        <input
          id="search"
          type="search"
          placeholder="🔍 कोई भी सामान खोजें..."
          autocomplete="off"
        >

        <button
          id="clearButton"
          type="button"
          class="clear-btn">
          ✖ Clear
        </button>

        <select id="category">
          <option value="all">सभी कैटेगरी</option>
        </select>

      </div>

      <!-- Result Count -->
      <p id="resultCount" class="result-count"></p>

      <!-- Products -->
      <div id="products" class="products-grid"></div>

      <!-- No Product Message -->
      <p id="emptyMessage" hidden>
        माफ कीजिए! कोई सामान नहीं मिला।
      </p>

    </section>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>© 2026 Gram Bajar | स्थानीय हुनर, स्थानीय बाजार</p>
  </footer>

</body>
</html>
